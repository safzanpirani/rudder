name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check Go formatting
        run: test -z "$(gofmt -l *.go)"
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o ruddr .
      - run: bun test
      - run: bunx tsc -p tsconfig.json --noEmit
      - name: Check the npm package contents
        run: |
          node -e 'require("./scripts/npm-binary.cjs")'
          npm pack --dry-run 2>&1 | tee pack.log
          grep -q 'tui/index.ts' pack.log
          grep -q 'main.go' pack.log
          ! grep -q 'core.test.ts' pack.log
          ! grep -q 'runner_test.go' pack.log
